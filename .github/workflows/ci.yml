name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 테스트 실행
        run: mvn test

      - name: 테스트 결과 리포트 업로드
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit 테스트 결과
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: 테스트 리포트 아티팩트 저장
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 30
